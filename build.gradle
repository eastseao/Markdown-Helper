// Top-level build file where you can add configuration options common to all sub-projects/modules.

import java.text.SimpleDateFormat

buildscript {
    ext {
        version_gradle_tools = '8.13.2'
        version_plugin_kotlin = "1.3.72"
        enable_plugin_kotlin = false

        version_compileSdk = 35
        version_buildTools = "35.0.0"
        version_minSdk = 17
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "https://jitpack.io" }
        google()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${version_gradle_tools}"
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        if (project.enable_plugin_kotlin) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${version_plugin_kotlin}"
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "https://jitpack.io" }
        google()
    }

    tasks.matching { task -> task.name.matches('(.*generate.*Resources)|(.*map.*SourceSetPaths)|(.*process.*NavigationResources)') }.all {
        task -> task.dependsOn copyRepoFiles, copyReadmeDefault, copyReadmeChinese
    }

    tasks.matching { it instanceof Test }.all { // Enable unit test output, html+xml output
        testLogging.events "passed", "skipped", "failed", "standardOut", "standardError"
        testLogging.showStandardStreams = true
        reports{
            junitXml { enabled true }
            html { enabled true }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

final String[] ROOT_TO_RAW_COPYFILES = ["CHANGELOG.md", "CONTRIBUTORS.md", "LICENSE.txt", "LICENSE.md", "LICENSE"]
task copyRepoFiles(type: Copy) {
    from rootProject.files(ROOT_TO_RAW_COPYFILES)
    into "app/src/main/res/raw"
    rename { String fileName -> fileName.replace(fileName, fileName.toLowerCase()) }
}

// The README is bilingual: README.md holds the Chinese text and is the default one
// GitHub renders on the repository home page, README.en.md holds the English text.
// Inside the app the two are kept apart by an Android resource qualifier, so that
// `R.raw.readme` (the in-app project page) follows the device language with no code
// change:
//   res/raw/readme.md         <- README.en.md   (fallback for every locale)
//   res/raw-zh-rCN/readme.md  <- README.md      (selected automatically on zh-rCN)
//
// NOTE: each task keeps its `into` as narrow as possible on purpose. Pointing a task
// at `app/src/main/res` itself makes Gradle treat that whole resource tree as the
// task's output, and the build then fails the implicit-dependency validation because
// `extractDeepLinks*` reads `res/navigation` (an unrelated subdirectory).
//   > Task ':app:extractDeepLinksFlavorDefaultDebug' uses this output of task
//   > ':copyReadmeFiles' without declaring an explicit or implicit dependency.
task copyReadmeDefault(type: Copy) {
    from rootProject.file("README.en.md")
    into "app/src/main/res/raw"
    rename { "readme.md" }
}
task copyReadmeChinese(type: Copy) {
    from rootProject.file("README.md")
    into "app/src/main/res/raw-zh-rCN"
    rename { "readme.md" }
}


@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
// Returns used android languages as a buildConfig array: {'de', 'it', ..}"
static String findUsedAndroidLocales() {
    Set<String> langs = new HashSet<>()
    new File('.').eachDirRecurse { dir ->
        final foldername = dir.name
        if (foldername.startsWith('values-') && !dir.absolutePath.contains("build" + File.separator + "intermediates") && !foldername.matches(".*values-((.*[0-9])|(land)|(port)).*")) {
            dir.eachFile { file ->
                if (file.name.toLowerCase().endsWith(".xml") && file.getText('UTF-8').contains("<string")) {
                    langs.add(foldername.replace("values-", ""))
                }
            }
        }
    }
    return '{' + langs.sort().collect { "\"${it}\"" }.join(",") + '}'
}


// The distributed source archive is not a git checkout, so these commands may fail.
// Return empty fallbacks instead of aborting the whole build.
ext.getGitHash = {
    try {
        return providers.exec {
            commandLine('git', 'rev-parse', 'HEAD')
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}()

ext.getGitLastCommitMessage = {
    try {
        return providers.exec {
            commandLine('git', 'log', '--oneline', '-1', '--format=%s')
            ignoreExitValue = true
        }.standardOutput.asText.get().trim().replaceAll("\"", "\\\\\"")
    } catch (Exception ignored) {
        return ''
    }
}()

@SuppressWarnings(["UnnecessaryQualifiedReference", "SpellCheckingInspection", "GroovyUnusedDeclaration"])
// Returns the build date in a RFC3339 compatible format. TZ is always converted to UTC
static String getBuildDate() {
    final SimpleDateFormat RFC3339_LIKE = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm'Z'")
    RFC3339_LIKE.setTimeZone(TimeZone.getTimeZone("UTC"))
    Date buildDate = new Date()

    // https://reproducible-builds.org/docs/source-date-epoch/
    try { buildDate = new Date(Long.parseLong(System.getenv('SOURCE_DATE_EPOCH')) * 1000) } catch(Exception ignore) {}

    return RFC3339_LIKE.format(buildDate)
}
